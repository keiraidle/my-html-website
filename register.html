  <main>
    <p>Hi, I am Keira Rensburg, an aspiring web developer learning HTML5 and CSS.</p>
    <p>I am building multi-page websites with clean layouts, reusable styles, and responsive components.</p>
    <p>Registration form coming soon.</p>

    <form action="#" method="post">
        <label>Full name: <input type="text" name="fullname" required minlength="2" pattern="[A-Za-z\s]+"></label><br><br>
        <label>Email: <input type="email" name="email" required></label><br><br>
        <label>Password: <input type="password" name="password" required minlength="8"></label><br><br>
        <label>Age: <input type="number" name="age" min="16" max="99"></label><br><br>
        <label>Start date: <input type="date" name="startdate"></label><br><br>
        <label>Course:
            <select name="course">
            <option value="html">HTML</option>
            <option value="css">CSS</option>
            </select>
        </label><br><br>
        <label><input type="radio" name="plan" value="full" required> Full-time</label>
        <label><input type="radio" name="plan" value="part" required> Part-time</label><br><br>
        <label><input type="checkbox" name="terms" required> I agree to the terms</label><br><br>
        <label>Comments: <textarea name="comments" rows="3"></textarea></label><br><br>
        <button type="submit">Register</button>
    </form>

  </main>
